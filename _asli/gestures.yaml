# Peta gesture -> efek. Ubah di sini, jangan di dalam kode.
#
# Pose satu tangan yang dikenali model:
#   peace, fist, open_palm, point, l_up, l_down, none
# l_up   = jempol + telunjuk membentuk L, telunjuk mengarah ke atas
# l_down = L yang sama tapi terbalik (telunjuk mengarah ke bawah)

single_hand:
  peace:
    effect: blur_full
    params: { min_radius: 9, max_radius: 61 }
  open_palm:
    effect: overlay_image
    params: { asset: default, scale: 1.4 }

two_hands:
  # kunci = pasangan pose kedua tangan, urutan tidak diperhatikan
  l_up + l_up:
    effect: blur_box
    params: { radius: 45 }
  l_up + l_down:
    effect: mosaic_box
    params: { blocks: 18 }
  l_down + l_down:
    effect: flip_box
    params: { axis: horizontal }
